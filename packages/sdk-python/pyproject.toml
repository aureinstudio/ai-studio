[project]
name = "ai-studio"
version = "0.1.0"
description = "Official Python SDK for ai-studio Public API"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "ai-studio" }]
keywords = ["ai-studio", "ai", "education", "lms"]
dependencies = [
  "httpx>=0.24",
]

[project.urls]
Homepage = "https://ai-studio-drab-nine.vercel.app"
Docs = "https://ai-studio-drab-nine.vercel.app/docs/api/v1"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ai_studio"]
